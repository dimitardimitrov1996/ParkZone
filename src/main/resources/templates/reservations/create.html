<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Make Reservation</title>
    <link rel="stylesheet" href="/css/style.css">

</head>
<body>

<div class="navbar">
    <div><strong>ParkZone</strong></div>
    <div>
        <a href="/home">Home</a>
        <a href="/reservations/create">Make a reservation</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">

    <div class="card">
        <h2>Make a Reservation</h2>

        <form th:action="@{/reservations/create}"
              th:object="${reservationCreateRequestDTO}"
              method="post"
              novalidate>

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="form-group">
                <label for="vehicleId">Vehicle</label>

                <select id="vehicleId" th:field="*{vehicleId}" required>
                    <option value="">Select vehicle</option>

                    <option th:each="v : ${vehicles}"
                            th:value="${v.id}"
                            th:text="${v.registrationNumber + ' - ' + v.brand + ' ' + v.model}">
                    </option>
                </select>

                <div class="error"
                     th:if="${#fields.hasErrors('vehicleId')}"
                     th:errors="*{vehicleId}">
                </div>
            </div>

            <div class="form-group">
                <label for="parkingLotId">Parking Lot</label>

                <select id="parkingLotId" th:field="*{parkingLotId}" required>
                    <option value="">Select parking lot</option>

                    <option th:each="p : ${parkingLots}"
                            th:value="${p.id}"
                            th:text="${p.name}"
                            th:data-daily-price="${p.dailyPrice}"
                            th:data-monthly-price="${p.monthlyPrice}"
                            th:data-yearly-price="${p.yearlyPrice}">
                    </option>
                </select>

                <div class="error"
                     th:if="${#fields.hasErrors('parkingLotId')}"
                     th:errors="*{parkingLotId}">
                </div>
            </div>

            <div class="form-group">
                <label for="parkingSpotId">Parking Spot</label>

                <select id="parkingSpotId" th:field="*{parkingSpotId}" required>
                    <option value="">Select parking spot</option>

                    <option th:each="s : ${parkingSpots}"
                            th:value="${s.id}"
                            th:attr="data-parking-lot-id=${s.parkingLot.id}"
                            th:text="${s.parkingLot.name + ' - Spot ' + s.spotNumber + ' - ' +
                            (s.disabledSpot ? 'Disabled' :
                            (s.electricChargingSpot ? 'Electric charging' : 'Normal'))}">
                    </option>
                </select>

                <div class="error"
                     th:if="${#fields.hasErrors('parkingSpotId')}"
                     th:errors="*{parkingSpotId}">
                </div>
            </div>

            <div class="form-group">
                <label for="reservationType">Reservation Type</label>

                <select id="reservationType" th:field="*{reservationType}" required>
                    <option value="">Select reservation type</option>

                    <option th:each="type : ${T(bg.softuni.parkzone.model.entities.reservation.ReservationType).values()}"
                            th:value="${type}"
                            th:text="${type}">
                    </option>
                </select>

                <div class="error"
                     th:if="${#fields.hasErrors('reservationType')}"
                     th:errors="*{reservationType}">
                </div>
            </div>

            <div class="form-group">
                <label for="startDate">Start Date</label>

                <input id="startDate"
                       type="datetime-local"
                       th:field="*{startDate}"
                       required>

                <div class="error"
                     th:if="${#fields.hasErrors('startDate')}"
                     th:errors="*{startDate}">
                </div>
            </div>

            <div class="form-group">
                <label for="endDate">End Date</label>

                <input id="endDate"
                       type="datetime-local"
                       th:field="*{endDate}"
                       required>

                <div class="error"
                     th:if="${#fields.hasErrors('endDate')}"
                     th:errors="*{endDate}">
                </div>
            </div>

            <div class="price-preview" id="pricePreview">
                <div>
                    <span class="price-preview-label">Total price</span>
                    <strong id="pricePreviewAmount">Select parking lot and reservation type</strong>
                </div>
            </div>

            <button type="submit" class="btn">
                Save Reservation
            </button>

        </form>

    </div>

</div>
<script src="/js/reservation-date.js"></script>
<script src="/js/reservation-spot-filter.js"></script>
<script>
    const parkingLotSelect = document.querySelector('[name="parkingLotId"]');
    const reservationTypeSelect = document.querySelector('[name="reservationType"]');
    const startDateInput = document.querySelector('[name="startDate"]');
    const endDateInput = document.querySelector('[name="endDate"]');
    const pricePreviewAmount = document.getElementById('pricePreviewAmount');

    function updatePricePreview() {
        const selectedParkingLot = parkingLotSelect.options[parkingLotSelect.selectedIndex];
        const reservationType = reservationTypeSelect.value;

        if (!selectedParkingLot || !selectedParkingLot.value || !reservationType) {
            pricePreviewAmount.textContent = 'Select parking lot and reservation type';
            return;
        }

        let basePrice;

        if (reservationType === 'DAILY') {
            basePrice = Number(selectedParkingLot.dataset.dailyPrice);
        } else if (reservationType === 'MONTHLY') {
            basePrice = Number(selectedParkingLot.dataset.monthlyPrice);
        } else if (reservationType === 'YEARLY') {
            basePrice = Number(selectedParkingLot.dataset.yearlyPrice);
        }

        if (!basePrice) {
            pricePreviewAmount.textContent = 'Price unavailable';
            return;
        }

        let totalPrice = basePrice;

        if (reservationType === 'DAILY') {
            const startDate = new Date(startDateInput.value);
            const endDate = new Date(endDateInput.value);

            if (startDateInput.value && endDateInput.value && endDate > startDate) {
                const millisecondsPerDay = 1000 * 60 * 60 * 24;
                const days = Math.ceil((endDate - startDate) / millisecondsPerDay);

                totalPrice = basePrice * days;
            }
        }

        pricePreviewAmount.textContent = totalPrice.toFixed(2) + ' EUR';
    }

    parkingLotSelect.addEventListener('change', updatePricePreview);
    reservationTypeSelect.addEventListener('change', updatePricePreview);
    startDateInput.addEventListener('change', updatePricePreview);
    endDateInput.addEventListener('change', updatePricePreview);
    startDateInput.addEventListener('input', updatePricePreview);
    endDateInput.addEventListener('input', updatePricePreview);

    updatePricePreview();
</script>
</body>
</html>
