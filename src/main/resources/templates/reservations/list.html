<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservations</title>
    <link rel="stylesheet" href="/css/style.css">

</head>
<body>

<div class="navbar">
    <div><strong>ParkZone</strong></div>
    <div>
        <a href="/home">Home</a>
        <a href="/reservations/create">Make a reservation</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">

    <div class="card">
        <h2>Your Reservations</h2>

        <div class="success"
             th:if="${successMessage}"
             th:text="${successMessage}">
        </div>

        <div class="error"
             th:if="${errorMessage}"
             th:text="${errorMessage}">
        </div>

        <div th:if="${#lists.isEmpty(reservationViews)}" class="empty-box">
            <p>You have no current reservations.</p>
            <a href="/reservations/create" class="btn">Make a reservation</a>
        </div>

        <div th:if="${!#lists.isEmpty(reservationViews)}">
            <table>
                <thead>
                <tr>
                    <th>Vehicle</th>
                    <th>Parking Lot</th>
                    <th>Parking Spot</th>
                    <th>Type</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Status</th>
                    <th>Invoice Status</th>
                    <th>Total Price</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="view : ${reservationViews}" th:with="r=${view.reservation}">

                    <td th:text="${r.vehicle.registrationNumber}"></td>

                    <td th:text="${r.parkingLot.name}"></td>

                    <td th:text="${r.parkingSpot.spotNumber}"></td>

                    <td th:text="${r.reservationType}"></td>

                    <td th:text="${#temporals.format(r.startDate, 'dd.MM.yyyy HH:mm')}">
                    </td>

                    <td th:text="${#temporals.format(r.endDate, 'dd.MM.yyyy HH:mm')}">
                    </td>

                    <td>

                        <span th:if="${r.status.name() == 'PENDING_PAYMENT'}"
                              class="status-completed">
                            PENDING PAYMENT
                        </span>

						<span th:if="${r.status.name() == 'ACTIVE'}"
                              class="status-active">
							ACTIVE
						</span>

                        <span th:if="${r.status.name() == 'COMPLETED'}"
                              class="status-completed">
							COMPLETED
						</span>

                        <span th:if="${r.status.name() == 'CANCELLED'}"
                              class="status-cancelled">
							CANCELLED
						</span>
                    </td>

                    <td>
                   <span th:text="${view.invoiceStatus}"
                         th:class="${view.invoiceStatus == 'PAID' ? 'status-active' :
                          (view.invoiceStatus == 'PENDING' ? 'status-completed' :
                          (view.invoiceStatus == 'UNAVAILABLE' ? 'status-warning' :
                          (view.invoiceStatus == 'REFUNDED' ? 'status-cancelled' : 'status-inactive')))}">
                   </span>
                    </td>

                    <td th:text="${r.totalPrice + ' EUR'}"></td>

                    <td>
                        <div class="action-stack">

                            <div>
                                <a th:if="${r.status.name() == 'PENDING_PAYMENT' && view.invoiceStatus == 'PENDING'}"
                                   th:href="@{/payments/reservation/{id}(id=${r.id})}"
                                   class="btn-spot btn-spot-success"
                                   title="Proceed to payment">
                                    <span>💳</span> Pay
                                </a>
                            </div>

                            <div>
                                <a th:if="${view.canEdit}"
                                   th:href="@{/reservations/edit/{id}(id=${r.id})}"
                                   class="btn-spot btn-spot-edit"
                                   title="Edit this reservation">
                                    <span>✏️</span> Edit
                                </a>
                            </div>

                            <div>
                                <form th:if="${r.status.name() == 'ACTIVE' || r.status.name() == 'PENDING_PAYMENT'}"
                                      th:action="@{/reservations/cancel/{id}(id=${r.id})}"
                                      method="post"
                                      class="action-form">

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">

                                    <button type="submit"
                                            class="btn-spot btn-spot-cancel"
                                            onclick="return confirm('Are you sure you want to cancel this reservation?')"
                                            title="Cancel this reservation">
                                        <span>❌</span> Cancel
                                    </button>
                                </form>
                            </div>

                            <div th:if="${r.status.name() != 'ACTIVE' && r.status.name() != 'PENDING_PAYMENT'}">
                                —
                            </div>

                        </div>
                    </td>

                </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>

</body>
</html>
