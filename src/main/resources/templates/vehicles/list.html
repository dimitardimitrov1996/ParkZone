<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Vehicles</title>
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="navbar">
	<div><strong>ParkZone</strong></div>
	<div>
		<a href="/home">Home</a>
		<a href="/vehicles/create">Add Vehicle</a>
		<a href="/logout">Logout</a>
	</div>
</div>

<div class="container">

	<div class="card">
		<h2>Your Vehicles</h2>

		<div th:if="${#lists.isEmpty(vehicles)}">
			<p>You have no vehicles yet. <a href="/vehicles/create">Add one</a>.</p>
		</div>

		<div th:if="${!#lists.isEmpty(vehicles)}">
			<table>
				<thead>
				<tr>
					<th>Registration</th>
					<th>Brand</th>
					<th>Model</th>
					<th>Type</th>
					<th>Engine</th>
					<th>Disabled Req.</th>
					<th>Owner</th>
					<th>Actions</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="v : ${vehicles}">
					<td th:text="${v.registrationNumber}"></td>
					<td th:text="${v.brand}"></td>
					<td th:text="${v.model}"></td>
					<td th:text="${v.vehicleType}"></td>
					<td th:text="${v.engineType}"></td>
					<td th:text="${v.disabledParkingRequired} ? 'Yes' : 'No'"></td>
					<td th:text="${v.owner != null} ? ${v.owner.username} : '—'"></td>
					<td>
						<div class="table-actions">
							<a class="btn-spot btn-spot-edit"
							   th:href="@{'/vehicles/edit/' + ${v.id}}"
							   title="Edit vehicle details">
								<span>✏️</span> Edit
							</a>

							<form th:action="@{/vehicles/delete/{id}(id=${v.id})}"
							      method="post"
							      class="inline-form">

								<input type="hidden"
								       th:name="${_csrf.parameterName}"
								       th:value="${_csrf.token}">

								<button type="submit"
								        class="btn-spot btn-spot-delete"
								        onclick="return confirm('Are you sure you want to delete this vehicle? This action cannot be undone.')"
								        title="Delete this vehicle permanently">
									<span>🗑️</span> Delete
								</button>
							</form>
						</div>
					</td>
				</tr>
				</tbody>
			</table>
		</div>

	</div>

</div>

</body>
</html>
